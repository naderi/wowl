<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wowl</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="flip" id="flip">
      <div class="flip__inner">
        <!-- ===== Front: photo view ===== -->
        <section class="flip__face flip__front">
          <div class="stage" id="stage">
            <img class="stage__img" id="img-a" alt="" />
            <img class="stage__img" id="img-b" alt="" />

            <div class="stage__scrim stage__scrim--top"></div>
            <div class="stage__scrim stage__scrim--bottom"></div>

            <div class="stage__spinner" id="spinner"><span></span></div>

            <button class="nav-arrow nav-arrow--left" id="nav-left" data-i18n-title="nav.older" hidden>
              <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6" />
              </svg>
            </button>
            <button class="nav-arrow nav-arrow--right" id="nav-right" data-i18n-title="nav.newer" hidden>
              <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18l6-6-6-6" />
              </svg>
            </button>

            <div class="stage__hint" id="hint" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="34" height="34" fill="none"
                   stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 1 1-3-6.7" />
                <path d="M21 3v6h-6" />
              </svg>
            </div>

            <header class="toolbar" data-tauri-drag-region>
              <div class="toolbar__group">
                <button class="icon-btn" id="btn-settings" data-i18n-title="toolbar.settings">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                    <path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                  </svg>
                </button>
                <button class="icon-btn" id="btn-history" data-i18n-title="toolbar.history">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3v5h5" />
                    <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8" />
                    <path d="M12 7v5l3 2" />
                  </svg>
                </button>
                <button class="icon-btn" id="btn-theme" data-i18n-title="toolbar.theme">
                  <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
                  </svg>
                  <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                  </svg>
                  <svg class="icon-system" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2" />
                    <path d="M8 21h8M12 17v4" />
                  </svg>
                </button>
                <button class="icon-btn" id="btn-download" data-i18n-title="toolbar.download">
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <path d="M7 10l5 5 5-5" />
                    <path d="M12 15V3" />
                  </svg>
                </button>
              </div>
              <div class="credit" id="credit" data-tauri-drag-region>
                <span class="credit__line" id="credit-source-line" data-tauri-drag-region hidden
                  ><span class="credit__label" data-tauri-drag-region data-i18n="credit.source"></span
                  ><a class="credit__link" id="credit-source" target="_blank" rel="noopener"></a
                ></span>
                <span class="credit__line" id="credit-photog-line" data-tauri-drag-region hidden
                  ><span class="credit__label" data-tauri-drag-region data-i18n="credit.photographer"></span
                  ><a class="credit__link" id="credit-photographer" target="_blank" rel="noopener"></a
                ></span>
              </div>
              <div class="window-controls">
                <button class="win-btn" id="btn-min" data-i18n-title="win.minimize">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M6 12h12" />
                  </svg>
                </button>
                <button class="win-btn win-btn--close" id="btn-close" data-i18n-title="win.close">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M6 6l12 12M18 6L6 18" />
                  </svg>
                </button>
              </div>
            </header>

            <footer class="actionbar">
              <button class="action-btn" id="btn-wallpaper" data-i18n="action.wallpaper"></button>
              <button class="action-btn" id="btn-lockscreen" data-i18n="action.lockscreen"></button>
            </footer>
          </div>
        </section>

        <!-- ===== Back: settings / history ===== -->
        <section class="flip__face flip__back">
          <header class="panel__head" data-tauri-drag-region>
            <button class="icon-btn" id="btn-back" data-i18n-title="panel.back">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
            </button>
            <h1 class="panel__title" id="panel-title" data-tauri-drag-region></h1>
            <div class="window-controls">
              <button class="win-btn win-btn--dark" id="btn-min-2" data-i18n-title="win.minimize">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <path d="M6 12h12" />
                </svg>
              </button>
              <button class="win-btn win-btn--dark win-btn--close" id="btn-close-2" data-i18n-title="win.close">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <path d="M6 6l12 12M18 6L6 18" />
                </svg>
              </button>
            </div>
          </header>

          <div class="panel__body">
            <!-- Settings -->
            <form class="settings" id="settings-form">
              <label class="field">
                <span class="field__label" data-i18n="field.provider"></span>
                <select id="f-provider"></select>
              </label>

              <label class="field" id="field-key-unsplash">
                <span class="field__label" data-i18n="field.unsplashKey"></span>
                <input id="f-unsplash-key" type="password" autocomplete="off" spellcheck="false"
                       data-i18n-placeholder="placeholder.unsplashKey" />
              </label>

              <label class="field" id="field-key-pixabay">
                <span class="field__label" data-i18n="field.pixabayKey"></span>
                <input id="f-pixabay-key" type="password" autocomplete="off" spellcheck="false"
                       data-i18n-placeholder="placeholder.pixabayKey" />
              </label>

              <label class="field" id="field-key-wallhaven">
                <span class="field__label" data-i18n="field.wallhavenKey"></span>
                <input id="f-wallhaven-key" type="password" autocomplete="off" spellcheck="false"
                       data-i18n-placeholder="placeholder.wallhavenKey" />
                <span class="field__hint" data-i18n="hint.wallhavenKey"></span>
              </label>

              <label class="field">
                <span class="field__label" data-i18n="field.terms"></span>
                <input id="f-terms" type="text" spellcheck="false"
                       data-i18n-placeholder="placeholder.terms" />
                <span class="field__hint" id="terms-hint"></span>
              </label>

              <label class="field">
                <span class="field__label" data-i18n="field.history"></span>
                <input id="f-history" type="number" min="0" max="500" step="1" />
              </label>

              <label class="field">
                <span class="field__label" data-i18n="field.historyMode"></span>
                <select id="f-history-mode">
                  <option value="loaded" data-i18n="historyMode.loaded"></option>
                  <option value="applied" data-i18n="historyMode.applied"></option>
                </select>
              </label>

              <label class="field">
                <span class="field__label" data-i18n="field.appearance"></span>
                <select id="f-theme">
                  <option value="system" data-i18n="theme.system"></option>
                  <option value="light" data-i18n="theme.light"></option>
                  <option value="dark" data-i18n="theme.dark"></option>
                </select>
              </label>

              <label class="field">
                <span class="field__label" data-i18n="field.language"></span>
                <select id="f-language">
                  <option value="en">English</option>
                  <option value="de">Deutsch</option>
                </select>
              </label>

              <div class="field">
                <span class="field__label" data-i18n="field.lockscreen"></span>
                <button type="button" class="secondary-btn" id="btn-reset-lockscreen" data-i18n="settings.resetLockscreen"></button>
              </div>
            </form>

            <!-- History -->
            <div class="history" id="history-view" hidden>
              <div class="history__bar" id="history-bar" hidden>
                <button type="button" class="mode-toggle" id="btn-sel-mode" aria-pressed="false">
                  <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="3" />
                    <path d="M8.5 12.5 11 15l4.5-5" />
                  </svg>
                  <span data-i18n="history.selMode"></span>
                </button>
                <span class="history__sel" id="history-sel" hidden></span>
                <span class="history__bar-actions">
                  <button type="button" class="multi-btn" id="btn-sel-all" hidden>
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M20 6 9 17l-5-5" />
                    </svg>
                  </button>
                  <button type="button" class="mini-btn mini-btn--danger" id="btn-sel-delete" hidden data-i18n-title="history.deleteTitle">
                    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                      <path d="M10 11v6M14 11v6" />
                    </svg>
                  </button>
                  <button type="button" class="text-btn" id="btn-clear-history" data-i18n="history.clear"></button>
                </span>
              </div>
              <p class="history__empty" id="history-empty" data-i18n="history.empty"></p>
              <div class="history__grid" id="history-grid"></div>
            </div>
          </div>

          <footer class="panel__foot" id="config-path"></footer>
        </section>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>

    <div class="ctx-menu" id="ctx-menu" hidden>
      <button type="button" data-action="open" data-i18n="history.ctxOpen"></button>
      <button type="button" data-action="delete" data-i18n="history.ctxDelete"></button>
    </div>

    <div class="ctx-menu" id="stage-menu" hidden>
      <button type="button" data-action="flip" data-i18n="stage.flip"></button>
      <div class="ctx-menu__sep"></div>
      <button type="button" data-action="wallpaper" data-i18n="action.wallpaper"></button>
      <button type="button" data-action="lockscreen" data-i18n="action.lockscreen"></button>
    </div>
  </body>
</html>
